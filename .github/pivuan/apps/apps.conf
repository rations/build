# Pivuan's own audio applications, packaged for arm64 by build-app.sh and
# published to the Pivuan apt repository by .github/workflows/pivuan-apps.yml.
#
# One app per line: package  repository  commit  upstream-version  pivuan-revision
# Each app is built at exactly this commit, and the commit is always one on the
# app's master branch: work on any other branch is merged to master first, then
# pinned. To update one, change its commit and version (and reset the revision
# to 1); bump only the revision for a packaging change, or for a new commit whose
# upstream version did not change, because a published version cannot be reused.
# The package version is <upstream-version>-pivuan<revision>.

