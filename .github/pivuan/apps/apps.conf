# Pivuan's own audio applications, and TONE3000's plug-in, packaged for arm64 by
# build-app.sh and published to the Pivuan apt repository by
# .github/workflows/pivuan-apps.yml.
#
# One app per line: package  repository  commit  upstream-version  pivuan-revision
# Each app is built at exactly this commit, and the commit is always one on the
# app's main branch (master, or main upstream): work on any other branch is merged
# there first, then pinned. TONE3000 is pinned at a release tag's commit. To update
# one, change its commit and version (and reset the revision to 1); bump only the
# revision for a packaging change, or for a new commit whose upstream version did
# not change, because a published version cannot be reused.
# The package version is <upstream-version>-pivuan<revision>.
#
# Pivuan: instead of a commit and a version, "master VERSION" (or "main VERSION") builds the
# branch's newest commit when the workflow runs, with the version in the app's VERSION file
# there. A release is then only a VERSION bump in the app's repository: nothing changes here.
# With publish, the workflow stops before building if that version is already published, so
# bump VERSION (or the revision here, for a packaging change) first.

