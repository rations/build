# Check that a pivuan-config desktop install resolves on Devuan without systemd.
#
# Runs in the official Devuan container (amd64 only on Docker Hub): parses the
# desktop package list the way pivuan-config does for excalibur/arm64, then
#   1. simulates the install (apt-get -s, no recommends, as on the image) on top
#      of the Pivuan base stack (sysvinit, elogind, eudev, ifupdown), and fails if
#      systemd or systemd-sysv would be installed or apt cannot resolve it;
#   2. checks every package also exists for arm64 in the Devuan archive;
#   3. does the same for the pivuan-config package's own dependencies;
#   4. adds Brave's apt repository the way pivuan-config does and checks the
#      browser (DESKTOP_BRAVE_PKG, e.g. brave-origin) the same way.
# With "inspect", it then installs the desktop for real (no recommends) and
# prints what decides whether logout/shutdown and the network applet work:
# polkit, elogind, PAM, polkit agents, and the wallpapers XFCE offers.

name: Pivuan desktop package check

on:
  workflow_dispatch:
    inputs:
      configng_ref:
        description: "rations/configng branch or tag"
        type: string
        default: claude/loving-fermi-gp2uoo
      desktop:
        description: "Desktop (YAML name)"
        type: string
        default: xfce
      tier:
        description: "Tier"
        type: choice
        options: [minimal, mid, full]
        default: minimal
      inspect:
        description: "Also install the desktop for real and print its session, polkit and PAM setup"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: ${{ inputs.desktop }} ${{ inputs.tier }} on excalibur
    runs-on: ubuntu-24.04
    container: devuan/devuan:excalibur
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Prepare Devuan container
        run: |
          set -eu
          apt-get update -q
          apt-get install -y -q --no-install-recommends git ca-certificates curl python3 python3-yaml
          # The Pivuan base stack the desktop is installed on top of.
          apt-get install -y -q --no-install-recommends sysvinit-core sysv-rc orphan-sysvinit-scripts eudev \
            elogind libpam-elogind dbus ifupdown isc-dhcp-client wpasupplicant chrony sudo

      - name: Fetch configng
        run: git clone --depth 1 --branch "${{ inputs.configng_ref }}" https://github.com/rations/configng.git configng

      - name: Resolve package list
        id: list
        run: |
          set -eu
          d=configng/tools/modules/desktops
          python3 "$d/scripts/parse_desktop_yaml.py" "$d/yaml" "${{ inputs.desktop }}" excalibur arm64 --tier "${{ inputs.tier }}" > parsed.sh
          . ./parsed.sh
          echo "Packages: ${DESKTOP_PACKAGES} ${DESKTOP_DM}"
          echo "${DESKTOP_PACKAGES} ${DESKTOP_DM}" | tr ' ' '\n' | grep -v '^$' | sort -u > packages.txt
          # Browser from Brave's apt repository (module_desktops _module_desktops_install_brave)
          echo "${DESKTOP_BRAVE_PKG:-}" | grep -v '^$' > brave.txt || true
          echo "Brave package: $(cat brave.txt)"
          # pivuan-config's own dependencies (tools/pivuan/build-deb.sh control file)
          sed -n 's/^Depends: //p' configng/tools/pivuan/build-deb.sh | tr ',' '\n' | sed 's/ //g' | grep -v '^$' > config-deps.txt
          wc -l packages.txt config-deps.txt brave.txt

      - name: Add Brave's apt repository
        run: |
          set -eu
          [ -s brave.txt ] || exit 0
          base=https://brave-browser-apt-release.s3.brave.com
          curl -fsSL -o /usr/share/keyrings/brave-browser-archive-keyring.gpg "$base/brave-browser-archive-keyring.gpg"
          curl -fsSL -o /etc/apt/sources.list.d/brave-browser-release.sources "$base/brave-browser.sources"
          cat /etc/apt/sources.list.d/brave-browser-release.sources
          apt-get update -q

      - name: Simulate install (amd64)
        run: |
          set -eu
          fail=0
          for list in packages.txt config-deps.txt brave.txt; do
            [ -s "$list" ] || continue
            echo "::group::apt-get -s install $(wc -l < "$list") packages from $list"
            mapfile -t pkgs < "$list"
            if ! apt-get -s -y --no-install-recommends install "${pkgs[@]}" > "sim-$list" 2>&1; then
              cat "sim-$list"
              echo "::error::apt cannot resolve the packages in $list"
              fail=1
            fi
            grep '^Inst ' "sim-$list" | awk '{print $2}' | sort > "inst-$list" || true
            echo "$(wc -l < "inst-$list") packages would be installed"
            echo "::endgroup::"
            if grep -xE 'systemd|systemd-sysv' "inst-$list"; then
              echo "::error::installing $list would pull in systemd:"
              grep -E '^Inst systemd(-sysv)? ' "sim-$list"
              fail=1
            fi
          done
          {
            echo "## ${{ inputs.desktop }} (${{ inputs.tier }}) on Devuan excalibur"
            echo ""
            echo "- Desktop packages requested: $(wc -l < packages.txt), new packages installed: $(wc -l < inst-packages.txt)"
            echo "- pivuan-config dependencies: $(wc -l < config-deps.txt), new packages installed: $(wc -l < inst-config-deps.txt)"
            [ -s brave.txt ] && echo "- Browser $(cat brave.txt) from Brave's repository, new packages installed: $(wc -l < inst-brave.txt)"
            echo "- systemd pulled in: $(cat inst-*.txt | grep -cxE 'systemd|systemd-sysv' | awk '{print ($1 ? "YES" : "no")}')"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $fail
        shell: bash

      - name: Check arm64 availability
        run: |
          set -eu
          dpkg --add-architecture arm64
          apt-get update -q
          missing=""
          mapfile -t all < <(sort -u packages.txt config-deps.txt brave.txt)
          for p in "${all[@]}"; do
            # Architecture: all packages are listed under the native arch as well
            apt-cache show "$p:arm64" > /dev/null 2>&1 || apt-cache show "$p" 2>/dev/null | grep -q '^Architecture: all' || missing="$missing $p"
          done
          if [[ -n "$missing" ]]; then
            echo "::error::not available for arm64:$missing"
            echo "- Missing on arm64:$missing" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- All packages available for arm64" >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Install and inspect (no recommends, as on the image)
        if: ${{ inputs.inspect }}
        run: |
          set -u
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d && chmod +x /usr/sbin/policy-rc.d
          mapfile -t pkgs < <(cat packages.txt config-deps.txt)
          apt-get install -y -q --no-install-recommends "${pkgs[@]}" > install.log 2>&1 || { tail -50 install.log; echo "::warning::install failed"; }
          sec() { echo "::group::$1"; shift; "$@" 2>&1; echo "::endgroup::"; }
          sec "installed: polkit, elogind, agents, applet" dpkg-query -W -f='${Package} ${Version} ${Status}\n' polkitd pkexec policykit-1 libpam-elogind elogind libpolkit-agent-1-0 xfce-polkit mate-polkit lxpolkit policykit-1-gnome polkit-kde-agent-1 lxqt-policykit network-manager-gnome consolekit
          sec "polkit agents available" apt-cache policy xfce-polkit mate-polkit lxpolkit policykit-1-gnome lxqt-policykit network-manager-gnome connman-gtk cmst
          sec "who recommends polkitd" sh -c 'apt-cache rdepends --installed polkitd; apt-cache show xfce4-session lightdm network-manager elogind | grep -E "^(Package|Version|Depends|Recommends|Suggests):"'
          sec "pam.d lightdm" sh -c 'for f in /etc/pam.d/lightdm /etc/pam.d/lightdm-greeter /etc/pam.d/lightdm-autologin /etc/pam.d/common-session; do echo "== $f"; grep -v "^#" "$f" | grep -v "^$"; done; ls /usr/share/pam-configs; ls /lib/*/security/pam_elogind.so /usr/lib/*/security/pam_elogind.so /usr/lib/*/security/pam_systemd.so'
          sec "xfce4-session shutdown backends" sh -c 'for b in /usr/bin/xfce4-session /usr/lib/*/xfce4/session/xfsm-shutdown-helper /usr/sbin/lightdm /usr/sbin/slick-greeter; do echo "== $b"; strings "$b" 2>/dev/null | grep -E "login1|ConsoleKit|PowerOff|Reboot|pkexec|shutdown" | sort -u | head -30; done'
          sec "login1 polkit policy (power-off, reboot)" sh -c 'ls /usr/share/polkit-1/actions/ /etc/polkit-1/rules.d /usr/share/polkit-1/rules.d; python3 - <<EOF
          import xml.etree.ElementTree as ET, glob
          for f in glob.glob("/usr/share/polkit-1/actions/org.freedesktop.login1.policy"):
              for a in ET.parse(f).getroot().iter("action"):
                  i = a.get("id")
                  if any(k in i for k in ("power-off", "reboot", "halt")):
                      d = a.find("defaults")
                      print(i, [(c.tag, c.text) for c in d])
          EOF'
          sec "xfce4-session xfconf defaults, xfdesktop backdrops" sh -c 'ls -la /usr/share/backgrounds /usr/share/backgrounds/* /usr/share/xfce4/backdrops 2>&1; find /etc/xdg/xfce4 -name "*.xml" | head; strings /usr/bin/xfdesktop | grep -iE "backdrop|backgrounds|\.(png|jpg|svg)$" | sort -u | head -20'
          sec "network-manager init script and NetworkManager.conf" sh -c 'ls -la /etc/init.d/network-manager /etc/rc2.d/*network* 2>&1; cat /etc/NetworkManager/NetworkManager.conf; ls /usr/share/dbus-1/system-services/'
          sec "lightdm config" sh -c 'grep -v "^#" /etc/lightdm/lightdm.conf | grep -v "^$"; ls /etc/lightdm /usr/share/lightdm/lightdm.conf.d 2>&1'
        shell: bash
