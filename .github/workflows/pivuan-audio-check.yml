# Check that the Pivuan Audio desktop's packages install on real arm64 Devuan excalibur.
#
# Devuan has no arm64 container image, so this builds one: mmdebstrap makes an excalibur arm64
# root (the Pivuan base stack: sysvinit, elogind, eudev, ifupdown) from the Devuan archive,
# checked with the pinned Devuan keys (.github/pivuan/devuan-keyring.sh), natively on GitHub's
# arm64 runner. Docker then runs .github/pivuan/audio-check.sh in it, which installs Pivuan
# Audio for real and checks it: no systemd, PipeWire, LightDM, Audio-Gui or Xorg server;
# PulseAudio with its JACK and Bluetooth modules, picom and the Numix icons; Pivuan's XLibre
# build with modesetting, glamor and libinput; every menu icon found; every program and
# plug-in of the Pivuan apps finds its libraries.
#
# mode "pivuan-config": the real desktop install, as on a Pi. pivuan-config is built from
#   rations/configng (configng_ref) and runs "module_desktops install de=audio"; then the
#   login, session, folders and realtime setup are checked, the desktop is removed, and
#   /etc/inittab must be back as it was.
# mode "packages": the package list below.
#
# The Pivuan apps and XLibre must be published first ("Pivuan audio apps" here, and
# "XLibre for Pivuan" in rations/pivuan, both with publish).
#
# Keys:
#   Pivuan    the public half of the PIVUAN_APT_SIGNING_KEY secret (as the image build does).
#   Devuan    DEVUAN_KEY_FINGERPRINTS, as in pivuan-build.yml.

name: Pivuan Audio install check

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "pivuan-config: install the desktop with pivuan-config; packages: the package list only"
        type: choice
        options: [pivuan-config, packages]
        default: pivuan-config
      configng_ref:
        description: "rations/configng branch or tag (mode pivuan-config)"
        type: string
        default: pivuan
      extra_packages:
        description: "More packages to install (space-separated; mode packages)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    name: Pivuan Audio on excalibur arm64 (${{ inputs.mode }})
    runs-on: ubuntu-24.04-arm
    env:
      DEVUAN_KEY_FINGERPRINTS: ${{ vars.DEVUAN_KEY_FINGERPRINTS || '72E3CB773315DFA2E464743D94532124541922FB 9F8D6C74DE661075FD171BE3B3982868D104092C' }}
      PIVUAN_APT_URL: https://rations.github.io/pivuan
      # The Pivuan base stack, as on the image (see pivuan-desktop-check.yml).
      BASE_PACKAGES: >-
        devuan-keyring ca-certificates file sysvinit-core sysv-rc orphan-sysvinit-scripts eudev
        elogind libpam-elogind dbus ifupdown isc-dhcp-client wpasupplicant chrony sudo
      # mode packages: the Pivuan Audio set (pivuan-config takes it from configng's yaml/audio.yaml).
      AUDIO_PACKAGES: >-
        xserver-xlibre-core xserver-xlibre-input-libinput x11-xkb-utils
        keyboard-configuration xinit x11-xserver-utils dbus-x11 libgl1-mesa-dri picom
        jwm lxterminal pcmanfm mousepad celluloid lxpolkit lxrandr lxappearance
        network-manager network-manager-gnome blueman bluez
        jackd2 alsa-utils pulseaudio pulseaudio-utils pulseaudio-module-bluetooth
        pulseaudio-module-jack pavucontrol pasystray
        adwaita-icon-theme numix-icon-theme fonts-dejavu-core udisks2 gvfs-backends
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mmdebstrap gpg gpgv xz-utils

      - name: Build pivuan-config
        if: ${{ inputs.mode == 'pivuan-config' }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -q --no-install-recommends jq python3-yaml
          git clone -q --depth 1 --branch "${{ inputs.configng_ref }}" https://github.com/rations/configng.git "${RUNNER_TEMP}/configng"
          "${RUNNER_TEMP}/configng/tools/pivuan/build-deb.sh" "${RUNNER_TEMP}/deb"
          ls -l "${RUNNER_TEMP}/deb"

      - name: Devuan keyring
        run: bash .github/pivuan/devuan-keyring.sh excalibur "${RUNNER_TEMP}/keys/devuan-archive-keyring.gpg"

      - name: Pivuan key
        env:
          SIGNING_KEY: ${{ secrets.PIVUAN_APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 "${GNUPGHOME}"
          [[ -n "${SIGNING_KEY}" ]] || { echo "::error::the PIVUAN_APT_SIGNING_KEY secret is not set"; exit 1; }
          gpg --batch --quiet --import <<< "${SIGNING_KEY}"
          pivuan_fpr="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          gpg --batch --export "${pivuan_fpr}" > "${RUNNER_TEMP}/keys/pivuan-archive-keyring.gpg"
          printf '## Keys\n\n- Pivuan: %s\n' "${pivuan_fpr}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Build the excalibur arm64 root
        run: |
          set -euo pipefail
          keys="${RUNNER_TEMP}/keys"
          # apt trusts only the pinned Devuan keys (signed-by), while bootstrapping and in the root.
          # The keyring sits at the same path on the host and in the root, since apt may resolve
          # a signed-by path in either while mmdebstrap runs.
          keyring=/usr/share/keyrings/pivuan-check-devuan.gpg
          sudo install -Dm 0644 "${keys}/devuan-archive-keyring.gpg" "${keyring}"
          sudo mmdebstrap --verbose --variant=minbase --architectures=arm64 \
            --include="$(tr -s ' ' ',' <<< "${BASE_PACKAGES}")" \
            --setup-hook="install -Dm 0644 '${keyring}' \"\$1${keyring}\"" \
            excalibur "${RUNNER_TEMP}/root.tar" \
            "deb [signed-by=${keyring}] http://deb.devuan.org/merged excalibur main"
          sudo docker import "${RUNNER_TEMP}/root.tar" pivuan-excalibur:check
          sudo rm -f "${RUNNER_TEMP}/root.tar"

      - name: Install and check Pivuan Audio
        env:
          MODE: ${{ inputs.mode }}
          EXTRA: ${{ inputs.extra_packages }}
        run: |
          set -euo pipefail
          # The Pivuan apps the desktop installs: all of apps.conf except Audio-Gui (still
          # packaged, but PulseAudio replaced it in the desktop).
          apps="$(awk '!/^#/ && NF && $1 != "audio-gui" { print $1 }' .github/pivuan/apps/apps.conf | tr '\n' ' ')"
          touch "${RUNNER_TEMP}/summary.md"
          mkdir -p "${RUNNER_TEMP}/deb"
          deb="$(cd "${RUNNER_TEMP}/deb" && ls pivuan-config_*.deb 2> /dev/null || true)"
          # sudo drops the environment: every value is passed explicitly.
          sudo docker run --rm \
            -v "${PWD}:/src:ro" -v "${RUNNER_TEMP}/keys:/keys:ro" -v "${RUNNER_TEMP}/deb:/deb:ro" \
            -v "${RUNNER_TEMP}/summary.md:/summary.md" \
            -e MODE="${MODE}" -e KEYS=/keys -e SUMMARY=/summary.md -e PIVUAN_APT_URL="${PIVUAN_APT_URL}" \
            -e PACKAGES="${AUDIO_PACKAGES} ${apps} ${EXTRA}" -e PIVUAN_APPS="${apps}" \
            -e PIVUAN_CONFIG_DEB="${deb:+/deb/${deb}}" \
            pivuan-excalibur:check bash /src/.github/pivuan/audio-check.sh \
            || status=$?
          cat "${RUNNER_TEMP}/summary.md" >> "${GITHUB_STEP_SUMMARY}"
          exit "${status:-0}"
